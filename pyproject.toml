[project]
name = "waspy"
version = "0.1.0"
description = "WhatsApp analyzer for chat groups"
readme = "README.md"
authors = [
    { name = "perealberto", email = "eralon.dev@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "dearpygui>=2.3.1",
    "es-core-news-sm",
    "matplotlib>=3.11.2",
    "networkx>=3.7",
    "numpy>=2.5.4",
    "pyqt6>=6.12.0",
    "scipy>=1.18.1",
    "spacy>=3.8.18",
    "tqdm>=4.70.1",
]

[project.scripts]
waspy = "waspy.main:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.sources]
es-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/es_core_news_sm-3.8.0/es_core_news_sm-3.8.0-py3-none-any.whl" }
